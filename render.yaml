# Blueprint de Render para el addon de Stremio.
# Render → New → Blueprint → selecciona este repositorio.
services:
  - type: web
    name: vimeus-stremio-addon
    runtime: node
    plan: free
    region: oregon
    rootDir: stremio
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render inyecta PORT automáticamente; el servidor escucha en 0.0.0.0.
      - key: NODE_VERSION
        value: "20"
      - key: LOG_LEVEL
        value: info

      # Proveedores activos y su orden de aparición en Stremio.
      - key: PROVIDERS
        value: vidcore,chillflix,nekowatch

      # Entregar HLS reproducible dentro de Stremio.
      - key: RESOLVE_DIRECT
        value: "true"
      - key: RESOLVE_TIMEOUT_MS
        value: "9000"
      # Una entrada por calidad (1080p, 720p…) desde la playlist maestra.
      - key: EXPAND_QUALITIES
        value: "true"
      # Mantener el reproductor web como alternativa.
      - key: INCLUDE_EXTERNAL
        value: "true"

      # IMPORTANTE: las tres fuentes cifran la resolución del stream, así que
      # el HLS sale de un resolvedor externo que tú despliegas. Sin esto el
      # addon solo entrega enlaces al reproductor web.
      # Marcadores: {provider} {type} {tmdb} {imdb} {anilist} {season} {episode}
      - key: RESOLVER_URL
        sync: false
      - key: VIDCORE_RESOLVER_URL
        sync: false
      - key: CHILLFLIX_RESOLVER_URL
        sync: false
      - key: NEKOWATCH_RESOLVER_URL
        sync: false
      - key: RESOLVER_TOKEN
        sync: false

      # Proxy HLS: inyecta Referer/Origin, reescribe playlists y descifra
      # manifiestos. Desactivarlo rompe la reproducción en casi todos los CDN.
      - key: PROXY_ENABLED
        value: "true"

      # ESTA VARIABLE DECIDE LA FACTURA.
      #   playlist  solo playlists y claves; los segmentos van directos al CDN.
      #             ~3,6 GB/mes con 12.000 usuarios y 2 películas cada uno.
      #   full      retransmite todo el vídeo: ~103 TB en ese mismo escenario,
      #             unos $15.800/mes a $0,15/GB. Úsalo solo para depurar.
      #   off       sin proxy; depende de que CDN y cliente cooperen.
      - key: PROXY_MODE
        value: playlist

      # Obligatorio con más de una instancia: si cada una genera el suyo, las
      # URLs firmadas por una serán rechazadas por las demás.
      - key: PROXY_SECRET
        generateValue: true
      - key: PROXY_URL_TTL_MS
        value: "28800000"

      # Protección frente a picos.
      - key: MAX_CONCURRENT_UPSTREAM
        value: "64"
      - key: BREAKER_THRESHOLD
        value: "5"
      - key: BREAKER_RESET_MS
        value: "30000"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX
        value: "120"

      # Opcional: mejora la conversión IMDb -> TMDB. Configúrala en el panel.
      - key: TMDB_API_KEY
        sync: false

      # Rellénalo tras el primer deploy con la URL real del servicio
      # (https://<nombre>.onrender.com). Si lo dejas vacío se deduce sola.
      - key: PUBLIC_URL
        sync: false
